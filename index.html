<!doctype html>
<html lang="en" class="light-theme theme-storebox-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rabiu Entreprises — Inventory Management System</title>
    <style>
      /* Instant boot splash — replaced by React as soon as the app mounts. */
      #senior-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      }
      #senior-splash .logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
      }
      #senior-splash .title {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.5px;
        color: #0a0a0a;
      }
      #senior-splash .subtitle {
        font-size: 12px;
        color: #404040;
        margin-top: -8px;
      }
      #senior-splash .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #e5e5e5;
        border-top-color: #0052d4;
        border-radius: 50%;
        animation: senior-spin 0.9s linear infinite;
      }
      @keyframes senior-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-white text-[#0a0a0a]">
    <div id="root">
      <div id="senior-splash">
        <img src="/logo.png" alt="Rabiu Entreprises" class="logo" />
        <div class="title">Rabiu Entreprises</div>
        <div class="subtitle">Inventory Management System &middot; Loading…</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
