[package]
name = "senior-citizen-accessories-pos"
version = "2.0.6"
description = "Joainas Mart Inventory Management System"
authors = ["Dronebug Technologies & Services"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "senior_accessories_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
